# How long a player has to act before the table plays for them.
# Running out of time throws the tile just drawn, or skips a call.
turn-timeout-seconds: 30

# Pause between computer players' moves, in ticks (20 ticks = 1 second).
bot-delay-ticks: 12

# Pause between the end of one hand and the deal of the next, in seconds.
next-hand-delay-seconds: 6

# How tiles are drawn in chat.
#   auto   drawn tiles for players who loaded the resource pack, text for the rest
#   tiles  always drawn tiles, whether or not the pack loaded
#   text   always coloured text such as 3m and 東
tile-graphics: auto

# Drawn tiles need the resource pack the plugin writes to
# plugins/MajongPlugin/majong-tiles.zip on startup. Host that file somewhere the
# players can download it, then put the address and the hash printed in the
# server log here. Leaving the address empty means the plugin never pushes a
# pack, and players see coloured text unless they installed the pack themselves.
# The pack is added alongside any others the server already sends, so an
# existing pack keeps working; players see both stacked.
resource-pack:
  url: ''
  sha1: ''
  prompt: 麻雀の牌を表示するためのリソースパックです
  # Kick players who refuse the pack. Only worth turning on for a mahjong server.
  required: false

# The table drawn in the world: tiles standing where the game is played.
# A player sees their own hand face up and everybody else's backs.
table:
  enabled: true
  # How far each seat sits from the middle of the table, in blocks.
  radius: 0.9
  # How high the tiles stand above the point the table was placed at.
  height: 0.9
  tile-scale: 0.5
  tile-spacing: 0.22

rules:
  # hanchan plays east and south rounds, tonpuusen only east.
  game-length: hanchan
  starting-points: 25000
  # One five of each suit counts as a red dora.
  red-fives: true
  # All simples scores in an open hand.
  open-tanyao: true
  # Only the player closest to the discarder may win on a discard.
  head-bump: true
  # Stop the game as soon as somebody goes below zero points.
  end-on-bankruptcy: true
