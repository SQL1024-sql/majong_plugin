# ============================================================
#  日本麻將 (立直麻將) — 設定檔
# ============================================================

rules:
  # 赤寶牌張數 (0 = 沒有赤寶牌, 3 = 五萬/五筒/五索各一張, 4 = 再多一張赤五筒)
  aka-dora: 3
  # 是否允許喰斷 (副露後的斷么九)
  kuitan: true
  # 累計 13 飜是否視為役滿
  kazoe-yakuman: true
  # 是否採用雙倍役滿 (國士十三面、四暗刻單騎、大四喜、純正九蓮寶燈)
  double-yakuman: true
  # 4 飜 30 符 / 3 飜 60 符是否切上滿貫
  kiriage-mangan: false
  # 起始點數
  starting-points: 25000
  # 打幾圈：1 = 東風戰、2 = 半莊戰、4 = 一莊戰
  rounds: 2
  # 是否啟用途中流局 (九種九牌、四風連打、四家立直、四槓散了、三家和)
  abortive-draws: true
  # 是否允許多家和 (三家和時流局)
  multiple-ron: true
  # 莊家聽牌是否連莊
  tenpai-renchan: true
  # 有人被擊飛 (點數 < 0) 是否立刻結束對局
  end-on-bankrupt: true
  # 每個決定的思考秒數，逾時會自動摸切 / 跳過
  turn-seconds: 20

bots:
  # 電腦思考的等待時間 (毫秒)，讓畫面不會一瞬間跳完
  delay-millis: 1000

game:
  # 每局結束後停留多久再開下一局 (毫秒)
  round-break-millis: 8000
  # 是否把每一張打出的牌顯示在聊天欄
  log-discards: true
